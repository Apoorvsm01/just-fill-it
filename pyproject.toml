[project]
name = "just-fill-it"
version = "0.3.0"
description = "Just Fill it!: one click from a job page to a tailored resume or cover letter, ready to drop into the application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "job-hunter",
  "pydantic>=2",
  "selectolax",
  "playwright==1.62.0",  # same as job-hunter, so both share one installed Chromium
  "pypdf",
]

[project.scripts]
just-fill-it = "just_fill_it.server:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
# The backend: job-hunter checked out next to this repo (see README, "Setup").
job-hunter = { path = "../job-hunter", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/just_fill_it"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # same as job-hunter
